# Made with `no-mistakes ci-workflow` from .no-mistakes.yaml, then changed for this repo:
# the tests build a Swift app and use macOS tools (codesign, ditto, defaults), so they run on macOS.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Start a run by hand (Actions > CI > Run workflow). Use it on main when GitHub lost the run of a merge.
  workflow_dispatch:

permissions:
  contents: read

# A new push to a PR cancels the older run of the PR. A run of main waits for the older run of main and never stops it, so a release is not stopped.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Tests
    # The repository variable CI_RUNS_ON picks the runner and must hold JSON. Unset, every PR (forks included)
    # runs on the GitHub-hosted macOS runner. When the Actions minute limit gets close, the maintainer sets it to
    # ["self-hosted","mac-local"] to run on the self-hosted Mac; fork PRs then run there too.
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"macos-latest"') }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # app/build.sh numbers the build with the commit count.
          fetch-depth: 0

      # Keep this command the same as commands.test in .no-mistakes.yaml.
      - name: Test
        run: app/test/run-all.sh

  release:
    name: Release the app
    # Only a push to main or a manual run on main. The job releases when app/, install.sh, or install-app.sh changed
    # since the commit of the newest app release, so a change that a failed or cancelled run did not release is
    # released by the next run.
    # install.sh and install-app.sh are included because the app downloads and runs them; a change to the other part
    # of install.sh makes one extra release, which is harmless.
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    # Always a GitHub-hosted runner, never the self-hosted mac-local runner: the release token is a secret.
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      # A fine-grained token: only theo-henry/zeus, Contents read and write. See "Release the Zeus app" in README.md.
      GH_TOKEN: ${{ secrets.ZEUS_RELEASE_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find out if the app changed since the newest app release
        id: changed
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "::error title=No release token::The secret ZEUS_RELEASE_TOKEN is not set, so CI cannot release the app. See \"Release the Zeus app\" in README.md."
            exit 1
          fi
          git fetch --quiet origin main
          if [ "$(git rev-parse origin/main)" != "$(git rev-parse HEAD)" ]; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No release::A newer commit is on main. Its run releases all app changes since the newest app release."
            exit 0
          fi
          body="$(gh api "repos/theo-henry/zeus/releases?per_page=100" --jq '
            [.[] | select(.draft == false and .prerelease == false and (.tag_name | test("^app-v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
            | sort_by(.tag_name | ltrimstr("app-v") | split(".") | map(tonumber)) | last | .body // ""')"
          released="$(printf '%s\n' "$body" | sed -nE 's/.*zeus-install commit ([0-9a-f]{40}).*/\1/p' | head -n 1)"
          echo "released=$released" >> "$GITHUB_OUTPUT"
          if [ -z "$released" ] || ! git cat-file -e "$released^{commit}" 2>/dev/null; then
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "The commit of the newest app release is not known. Release."
          elif git diff --quiet "$released" HEAD -- app install.sh install-app.sh; then
            echo "app=false" >> "$GITHUB_OUTPUT"
            echo "The app did not change since the newest app release ($released). No release."
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "The app changed since the newest app release ($released). Release."
          fi

      - name: Release
        if: steps.changed.outputs.app == 'true'
        env:
          RELEASED: ${{ steps.changed.outputs.released }}
        run: |
          if [ -n "$RELEASED" ] && git cat-file -e "$RELEASED^{commit}" 2>/dev/null; then
            ZEUS_RELEASE_NOTE="$(printf 'Changes:\n%s' "$(git log --format='- %s' "$RELEASED..HEAD" -- app install.sh install-app.sh)")"
            export ZEUS_RELEASE_NOTE
          fi
          app/release.sh
