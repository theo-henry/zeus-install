name: Require no-mistakes

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
    branches: [main]

permissions:
  contents: read
  # The action reads the live PR body and head SHA. Without this permission the check fails closed.
  pull-requests: read

concurrency:
  group: no-mistakes-required-${{ github.event.pull_request.number }}-${{ (github.event.action == 'opened' || github.event.action == 'edited') && github.run_id || 'head-change' }}
  cancel-in-progress: true

jobs:
  check:
    # Keep this job name exactly: branch rules match the check by this name.
    name: PR must be raised via no-mistakes
    runs-on: ubuntu-latest
    steps:
      # Pinned to the release commit, never @main. The action never checks out or runs repository code,
      # so it is safe on pull requests from forks.
      - name: Verify no-mistakes signature and pipeline attestation
        uses: kunchenguid/no-mistakes/.github/actions/require-no-mistakes@f6441c96c352a18b9cadcaef6b6c7017e9ac3970 # v1.80.1
