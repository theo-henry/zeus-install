# Per-repo no-mistakes settings.
# .github/workflows/ci.yml runs the same test command, so the pipeline and CI check the same things.
commands:
  # The PTY, the plugin scope of install.sh, install-app.sh on a simulated new Mac, the app's self-update, the update of
  # an installed app, and the app on a simulated new Mac. The app windows stay behind the other apps.
  # GitHub and the downloads are simulated; the real home folder is not used. app/release.sh (update part "release")
  # builds for two architectures and is left out.
  test: 'app/test/run-all.sh'
# The app tests launch real app copies and take about 25-30 minutes on a busy Mac.
test_agent_timeout: "60m"
